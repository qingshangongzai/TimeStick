<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>TimeStick 时间贴</title>
  <desc>天蓝圆角方块底 + 白色表盘：全屏时间悬浮窗图标源</desc>

  <defs>
    <!-- 顶部一层极淡白光，给纯色底一点体积感（色相不变，仍是 #66CCFF） -->
    <radialGradient id="gloss" cx="0.3" cy="0.06" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 盘面：纯白到极淡蓝白，避免大块死白 -->
    <linearGradient id="dial" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F9FF"/>
    </linearGradient>
    <filter id="dialShadow" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0A4C86" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 蓝色圆角方块底（236×236 居中，圆角 52），品牌色 #66CCFF -->
  <rect x="10" y="10" width="236" height="236" rx="52" fill="#66CCFF"/>
  <rect x="10" y="10" width="236" height="236" rx="52" fill="url(#gloss)"/>

  <!-- 表盘：白色盘面，圆心略高于几何中心（阴影下坠后视觉居中） -->
  <circle cx="128" cy="126" r="77" fill="url(#dial)" filter="url(#dialShadow)"/>

  <!-- 次刻度：每整点 30°，跳过 12/3/6/9 点，细短半透明（以 12 点刻度为模板绕圆心旋转） -->
  <g stroke="#12304D" stroke-linecap="round" stroke-width="3.5" opacity="0.5">
    <path d="M128 57 V64" transform="rotate(30 128 126)"/>
    <path d="M128 57 V64" transform="rotate(60 128 126)"/>
    <path d="M128 57 V64" transform="rotate(120 128 126)"/>
    <path d="M128 57 V64" transform="rotate(150 128 126)"/>
    <path d="M128 57 V64" transform="rotate(210 128 126)"/>
    <path d="M128 57 V64" transform="rotate(240 128 126)"/>
    <path d="M128 57 V64" transform="rotate(300 128 126)"/>
    <path d="M128 57 V64" transform="rotate(330 128 126)"/>
  </g>
  <!-- 主刻度：12 / 3 / 6 / 9 点，更长更粗 -->
  <g stroke="#12304D" stroke-linecap="round" stroke-width="6">
    <path d="M128 55 V67"/>
    <path d="M128 55 V67" transform="rotate(90 128 126)"/>
    <path d="M128 55 V67" transform="rotate(180 128 126)"/>
    <path d="M128 55 V67" transform="rotate(270 128 126)"/>
  </g>

  <!-- 指针：10:10 经典角度，时针短粗、分针长细，圆头 -->
  <g stroke="#12304D" stroke-linecap="round">
    <path d="M128 126 L97.5 105" stroke-width="13"/>
    <path d="M128 126 L172 103" stroke-width="8.5"/>
  </g>
  <!-- 秒针：橙红细针（呼应产品的秒级显示），尾端藏进中心点 -->
  <path d="M128 122 V178" stroke="#FF6A4D" stroke-width="4" stroke-linecap="round"/>
  <!-- 中心点 -->
  <circle cx="128" cy="126" r="8.5" fill="#12304D"/>
  <circle cx="128" cy="126" r="3" fill="#FFFFFF"/>
</svg>
